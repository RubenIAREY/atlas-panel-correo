<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>ATLAS · Página privada</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'">
<style>:root{color-scheme:light}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F4F6F9;color:#111827;font:16px/1.45 "Segoe UI",Inter,Arial,sans-serif;padding:16px;box-sizing:border-box}
form{box-sizing:border-box;width:min(420px,100%);background:#fff;border-radius:16px;padding:28px 28px 24px;box-shadow:0 18px 45px rgba(0,42,85,.12)}
.ban{height:6px;border-radius:3px;margin-bottom:18px;background:linear-gradient(90deg,#004A98 0 72%,#CE0E2D 72% 86%,#FFA400 86%)}
h1{margin:0 0 6px;font-size:23px}p{margin:0 0 18px;color:#6B7280;font-size:15px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#004A98;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #D1D5DB;background:#fff;color:#111827;font-size:17px}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:#004A98;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
#msg{min-height:22px;margin-top:10px;font-size:14px;color:#CE0E2D}.pie{margin:14px 0 0;font-size:12.5px;color:#9CA3AF}</style></head><body>
<form id="f"><div class="ban"></div><h1>ATLAS · Panel de control</h1><p>Página privada. Escribe la contraseña.</p>
<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" autofocus required>
<button type="submit">Entrar</button><div id="msg" role="status"></div><p class="pie" id="act"></p></form>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function getManifest(){const r=await fetch('manifiesto.json',{cache:'no-store'});if(!r.ok)throw Error('network');const m=await r.json();if(m.doc!=='d/0.bin'||m.iter!==600000||b64(m.sal).length!==16||!String(m.sha256).match(/^[a-f0-9]{64}$/))throw Error('manifest');return m}
getManifest().then(m=>{document.getElementById('act').textContent='Actualizado: '+m.actualizado}).catch(()=>{});
document.getElementById('f').addEventListener('submit',async ev=>{
 ev.preventDefault();const msg=document.getElementById('msg');msg.textContent='Abriendo…';let datos;
 try{
  const man=await getManifest();
  const response=await fetch(man.doc+'?v='+encodeURIComponent(man.actualizado),{cache:'no-store'});if(!response.ok)throw Error('network');
  const b=new Uint8Array(await response.arrayBuffer());
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');if(digest!==man.sha256)throw Error('version');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(man.sal),iterations:man.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  datos=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12));
 }catch(err){msg.textContent=['network','manifest','version'].includes(err.message)?'No se puede cargar la versión actual. Recarga y vuelve a intentarlo.':'Contraseña incorrecta. Vuelve a probar.';return}
 try{
  msg.textContent='Cargando el panel…';
  const html=await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.getElementById('pw').value='';document.open();document.write(html);document.close();
 }catch(err){msg.textContent='No se pudo abrir el panel en este navegador.'}
});
</script></body></html>
